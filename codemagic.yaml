workflows:
  ios-build:
    name: Bowls Trainer iOS - Signed Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - APP_STORE_CONNECT

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bowlstrainer.app

      xcode: 26.0
      node: 20.11.1

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bowlstrainer.app"
        APPLE_TEAM_ID: "89Q6ZH7Q53"

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Apply Codemagic signing profiles
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          BUILD_NUMBER=$(git rev-list --count HEAD)
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Archive app
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/xcarchive/App.xcarchive

      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
