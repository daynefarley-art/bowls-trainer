workflows:
  ios-build:
    name: Bowls Trainer iOS - Signed Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - APP_STORE_CONNECT

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bowlstrainer.app

      xcode: 26.0
      node: 22.12.0

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bowlstrainer.app"
        APPLE_TEAM_ID: "89Q6ZH7Q53"

    scripts:
      - name: Install npm dependencies
        script: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Apply Codemagic signing profiles
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Set app version and build number
        script: |
          cd ios/App
          BUILD_NUMBER=$(git rev-list --count HEAD)
          agvtool new-marketing-version 1.0
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Archive app
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/xcarchive/App.xcarchive

      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false

  android-build:
    name: Bowls Trainer Android - AAB
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22.12.0
      java: 17

    scripts:
      - name: Install npm dependencies
        script: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor Android project
        script: |
          npx cap sync android

      - name: Set Android version
        script: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          sed -i.bak "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" android/app/build.gradle
          sed -i.bak 's/versionName "[^"]*"/versionName "1.0"/' android/app/build.gradle

      - name: Build Android App Bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
